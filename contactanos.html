<html lang="es">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="menu-lateral.css">
</head>
<body>

    <header>
        <h1>Contáctanos</h1>
        <p>Estamos para ayudarte</p>
    </header>

    <div class="contenedor">
        <nav class="menu-lateral">
            <a href="carrito de compras con pedidos completos.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="ofertas.html">Ofertas</a>
            <a href="contactanos.html">Contactos</a>
        </nav>

        <main class="contenido">
            <h2>Información de contacto</h2>
            <p>Comunícate con nosotros para obtener más información.</p>

            <p><strong>Teléfono:</strong> 000-000-0000</p>
            <p><strong>Correo electrónico:</strong> ejemplo@correo.com</p>
            <p><strong>Dirección:</strong> Nuestra oficina principal</p>

            <h2>Envíanos un mensaje</h2>

            <form>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
                <br><br>

                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
                <br><br>

                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje"
                          rows="5" required></textarea>
                <br><br>

                <button type="submit">Enviar mensaje</button>
            </form>
        </main>
    </div>

</body>
</html>
